name: Independent rebuild checks
on:
  push:
    branches: [rebuild/camscanner-reference]
    paths: [app/**, gradle/**, build.gradle.kts, settings.gradle.kts, gradle.properties, .github/device-check.sh, .github/workflows/rebuild.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rebuild-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Prepare installable preview
        run: |
          mkdir -p preview
          cp app/build/outputs/apk/debug/app-debug.apk preview/DocScan-New-0.1.8-preview.apk
          cd preview
          sha256sum DocScan-New-0.1.8-preview.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DocScan-New-0.1.8-preview
          path: preview/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rebuild-build-reports
          path: |
            app/build/reports/
            app/build/test-results/
  device:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 28
            locale: en
            emulator_build: '10696886'
          - api: 29
            locale: en
            emulator_build: ''
          - api: 35
            locale: he
            emulator_build: ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reserve space for the Android virtual device
        run: sudo rm -rf /usr/share/dotnet
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Compile before booting the guest
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace && ./gradlew --stop
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          # Latest: API 28 camera format abort; 30.1.5: ADB did not stabilize. Try 32.1.15.
          emulator-build: ${{ matrix.emulator_build }}
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -memory 4096
          script: bash .github/device-check.sh ${{ matrix.locale }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rebuild-device-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            screenshots/



name: Independent rebuild checks
on:
  push:
    branches: [rebuild/camscanner-reference]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rebuild-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Prepare installable preview
        run: |
          mkdir -p preview
          cp app/build/outputs/apk/debug/app-debug.apk preview/DocScan-New-0.1.0.apk
          cd preview
          sha256sum DocScan-New-0.1.0.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DocScan-New-0.1.0
          path: preview/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rebuild-build-reports
          path: |
            app/build/reports/
            app/build/test-results/
  device:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            locale: en
          - api: 35
            locale: he
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          script: bash .github/device-check.sh ${{ matrix.locale }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rebuild-device-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            screenshots/

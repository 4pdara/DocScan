name: Publish verified Native prerelease
on:
  push:
    branches: [rebuild/camscanner-reference]
    paths: [.github/native-release-0.1.3.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docscan-native-v0.1.3-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == '4pdara/DocScan' && github.ref == 'refs/heads/rebuild/camscanner-reference'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the baseline from the validated independent rebuild
        uses: actions/download-artifact@v4
        with:
          name: DocScan-New-0.1.3
          run-id: 42133225484
          github-token: ${{ github.token }}
          path: release-baseline
      - name: Verify and publish the exact signed Native APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 research/publish_native_release.py --baseline release-baseline/DocScan-New-0.1.3.apk

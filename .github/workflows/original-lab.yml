name: Original CamScanner Frida observation
on:
  push:
    branches: [rebuild/camscanner-reference]
    paths: [research/original_android_lab.sh, .github/workflows/original-lab.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Stop superseded lab attempts from this task
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST repos/4pdara/DocScan/actions/runs/42145934099/cancel || true
          gh api -X POST repos/4pdara/DocScan/actions/runs/42144840626/cancel || true
      - name: Reserve space for the ARM translation guest
        run: sudo rm -rf /usr/share/dotnet
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Download exact official inputs and verify vendor signature
        run: |
          curl -fL --retry 3 https://cs-dl.camscanner.com/download/CamScanner.apk -o /tmp/CamScanner.apk
          echo 'fa4f83b6990aa0d83bf9507d414e3fbe93cb9bfbfe6da0612752c5faf1c29d46  /tmp/CamScanner.apk' | sha256sum -c -
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs /tmp/CamScanner.apk 2>/dev/null > /tmp/vendor-certificate.txt
          grep 'Signer #1 certificate SHA-256 digest: 7fb4c4f789b7258fc63d300a8e94f393a6a8ec2f29d86dd0cafd1f36347ea23f' /tmp/vendor-certificate.txt
          python3 -m pip install frida==17.26.0 frida-tools==14.11.0
          curl -fL --retry 3 https://github.com/frida/frida/releases/download/17.26.0/frida-server-17.26.0-android-x86_64.xz -o /tmp/frida.xz
          echo '5507894927e23837d4099bcbfa026e9d227bfc47544a115971fd1a358fba7437  /tmp/frida.xz' | sha256sum -c -
          xz -dc /tmp/frida.xz > /tmp/frida-server
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 8
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          script: bash research/original_android_lab.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-camscanner-frida-android-35
          path: research-original-results/

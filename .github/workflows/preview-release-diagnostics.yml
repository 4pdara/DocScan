name: Collect stalled 0.1.8.1 installation diagnostics
on:
  push:
    branches: [rebuild/camscanner-reference]
    paths: [.github/workflows/preview-release-diagnostics.yml]
permissions:
  contents: read
  actions: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Stop only the stalled release run and collect its failed Android 11 log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo='4pdara/DocScan'
          run='43337786934'
          job='131598667647'
          status=$(gh api "repos/$repo/actions/runs/$run" --jq .status)
          if [[ "$status" != 'completed' ]]; then gh api -X POST "repos/$repo/actions/runs/$run/cancel"; fi
          for attempt in {1..30}; do
            status=$(gh api "repos/$repo/actions/jobs/$job" --jq .status)
            [[ "$status" == 'completed' ]] && break
            sleep 3
          done
          gh api "repos/$repo/actions/jobs/$job/logs" > android11-job.log
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('android11-job.log').read_text().splitlines()
          for i,line in enumerate(lines):
              if 'INSTRUMENTATION_STATUS: stack=' in line and 'AssumptionViolatedException' not in line:
                  print('\n'.join(lines[max(0,i-6):i+65]))
              if 'FAILURES!!!' in line or 'Tests run:' in line:
                  print(line)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-android11-diagnostics
          path: android11-job.log

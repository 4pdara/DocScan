name: Publish DocScan v0.1.0 preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-docscan-v0.1.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: '41546878460'
      SOURCE_COMMIT: '8851ac85363d27f12c18ce3995144e259802e2f8'
    steps:
      - name: Verify the tested source build
        run: |
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > build-run.json
          python3 - <<'PY'
          import json, os
          run = json.load(open('build-run.json'))
          assert os.environ['GH_REPO'] == '4pdara/DocScan'
          assert run['head_sha'] == os.environ['SOURCE_COMMIT']
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['workflow_id'] == 405101033
          PY
      - name: Download the verified APK
        run: |
          gh run download "$BUILD_RUN_ID" --repo "$GH_REPO" --name DocScan-debug --dir build-apk
          test -f build-apk/app-debug.apk
          unzip -t build-apk/app-debug.apk > /dev/null
          mkdir release-assets
          cp build-apk/app-debug.apk release-assets/DocScan-0.1.0-debug.apk
          cd release-assets
          sha256sum DocScan-0.1.0-debug.apk > SHA256SUMS.txt
      - name: Publish the development pre-release
        run: |
          cat > release-notes.md <<'NOTES'
          גרסת הפיתוח הראשונה של **DocScan**, להתנסות באנדרואיד 8.0 ומעלה.

          ### מה כלול

          - צילום ידני של כמה עמודים למסמך אחד וייבוא תמונות מהמכשיר.
          - טיוטות מקומיות, שינוי שם וסדר עמודים, סיבוב וארבעה מסננים בסיסיים.
          - שמירת המקור בנפרד מהעריכות, השוואה למקור, ייצוא ושיתוף PDF אחד.
          - עברית ו־RTL, אנגלית ומצב כהה. ללא הרשאת אינטרנט.

          ### עדיין בפיתוח

          צילום רציף ללא לחיצה, זיהוי קצוות, חיתוך ותיקון פרספקטיבה, ניקוי קמטים וכיתוב מהצד השני, ייבוא PDF, שמירה לגלריה ו־OCR.

          ### התקנה ובדיקות

          להוריד את **DocScan-0.1.0-debug.apk** שבנכסים למטה ולהתקין במכשיר Android. קובץ SHA256SUMS.txt מצורף לאימות ההורדה.

          זו גרסת **Debug לניסוי**, שעדיין דורשת בדיקת מצלמה במכשיר אמיתי. חתימות Debug עשויות להשתנות בין בניות; יש לייצא סריקות חשובות לפני הסרת גרסה קודמת.

          הבנייה המצורפת עברה 11 בדיקות יחידה, Lint, בדיקת ייצוא PDF ושימור מקורות באמולטור ופתיחת המסך הראשי.

          [ריצת הבדיקות והבנייה](https://github.com/4pdara/DocScan/actions/runs/41546878460)

          Source commit: `8851ac85363d27f12c18ce3995144e259802e2f8`
          NOTES
          gh release create v0.1.0 \
            --repo "$GH_REPO" \
            --target "$SOURCE_COMMIT" \
            --title 'DocScan v0.1.0 — גרסת ניסוי' \
            --prerelease \
            --notes-file release-notes.md \
            release-assets/DocScan-0.1.0-debug.apk release-assets/SHA256SUMS.txt

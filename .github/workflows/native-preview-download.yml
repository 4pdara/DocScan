name: Experimental Native 0.1.5 download
on:
  push:
    branches: [rebuild/camscanner-reference]
    paths: [.github/workflows/native-preview-download.yml, .github/native-preview-0.1.5.json]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  stage:
    if: contains(github.event.head_commit.message, '[stage-native-0.1.5]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1578dcc6123d915d74c837b3ce7e399c30ceee95
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Require completed validation of this exact application source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import subprocess,json
          for run in [42189237344,42189237349]:
              data=json.loads(subprocess.check_output(['gh','api',f'repos/4pdara/DocScan/actions/runs/{run}']))
              assert data['head_sha']=='1578dcc6123d915d74c837b3ce7e399c30ceee95'
              assert data['status']=='completed' and data['conclusion']=='success'
          PY
      - name: Prepare the private native build input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download native-v0.1.3-research --pattern DocScan-Native-0.1.3-debug.apk --dir /tmp/native-baseline
          echo '6b9ad458d620295a28bdabc0e7db87829dda7bec16fbb73862de09605fc16a5a  /tmp/native-baseline/DocScan-Native-0.1.3-debug.apk' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('/tmp/native-input/arm64-v8a');root.mkdir(parents=True)
          with zipfile.ZipFile('/tmp/native-baseline/DocScan-Native-0.1.3-debug.apk') as archive:
              for name in ['opencv','ncnn','MNN','CVNN','magicenhancer','imageprocessor']:
                  filename='lib'+name+'.so';(root/filename).write_bytes(archive.read('lib/arm64-v8a/'+filename))
          PY
          ./gradlew -PcamScannerNativeDir=/tmp/native-input assembleDebug --stacktrace
          mkdir internal-stage
          cp app/build/outputs/apk/debug/app-debug.apk internal-stage/internal-signing-input.apk
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('internal-stage/internal-signing-input.apk')
          (p.parent/'source.json').write_text(json.dumps({'source_commit':'1578dcc6123d915d74c837b3ce7e399c30ceee95','size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: internal-native-0.1.5-signing-input
          path: internal-stage/
          retention-days: 3
  download:
    if: contains(github.event.head_commit.message, '[deliver-native-0.1.5]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore the exact signed and verified experimental APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 research/assemble_native_preview.py --manifest .github/native-preview-0.1.5.json --output preview-download
      - uses: actions/upload-artifact@v4
        with:
          name: DocScan-Native-0.1.5-preview
          path: preview-download/*.apk
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: DocScan-Native-0.1.5-checksum
          path: preview-download/SHA256SUMS.txt
          retention-days: 90

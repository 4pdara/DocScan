name: Isolated native filter matrix and Frida
on:
  push:
    branches: [rebuild/camscanner-reference]
    paths: [research/android_filter_matrix.sh, .github/workflows/filter-matrix.yml, app/src/androidTest/java/com/docscan/rebuild/RebuildFlowTest.kt, app/src/main/java/com/docscan/rebuild/imaging/**, app/src/main/java/com/intsig/**]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Reserve space for the ARM translation guest
        run: sudo rm -rf /usr/share/dotnet
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Prepare private lab inputs without adding them to source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download native-v0.1.3-research --pattern DocScan-Native-0.1.3-debug.apk --dir /tmp/native-baseline
          echo '6b9ad458d620295a28bdabc0e7db87829dda7bec16fbb73862de09605fc16a5a  /tmp/native-baseline/DocScan-Native-0.1.3-debug.apk' | sha256sum -c -
          python3 - <<'PY'
          import zipfile,pathlib
          names=['opencv','ncnn','MNN','CVNN','magicenhancer','imageprocessor']
          root=pathlib.Path('/tmp/native-lab/arm64-v8a');root.mkdir(parents=True)
          with zipfile.ZipFile('/tmp/native-baseline/DocScan-Native-0.1.3-debug.apk') as z:
              for name in names:
                  f='lib'+name+'.so';(root/f).write_bytes(z.read('lib/arm64-v8a/'+f))
          PY
          ./gradlew -PcamScannerNativeDir=/tmp/native-lab assembleDebug assembleDebugAndroidTest --stacktrace
          ./gradlew --stop
          python3 -m pip install frida==17.26.0 frida-tools==14.11.0
          curl -fL --retry 3 https://github.com/frida/frida/releases/download/17.26.0/frida-server-17.26.0-android-x86_64.xz -o /tmp/frida.xz
          echo '5507894927e23837d4099bcbfa026e9d227bfc47544a115971fd1a358fba7437  /tmp/frida.xz' | sha256sum -c -
          xz -dc /tmp/frida.xz > /tmp/frida-server
      - name: Keep native build input for signing with the existing private research key
        uses: actions/upload-artifact@v4
        with:
          name: Native-0.1.6-build-input-${{ matrix.api }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 30
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -memory 4096
          script: bash research/android_filter_matrix.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-isolated-matrix-${{ matrix.api }}
          path: research-matrix/


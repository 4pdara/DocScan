name: One-time cleanup requested by the owner (15 Nov 2026)
# Removes the old DocScan v0.x line and the design builds: the branches and releases listed below, nothing else.
# Kept: main, rebuild/camscanner-reference (CamScanner research), every scanner-v* and native-v* release, and the
# two drafts (the phone signing key and the 0.1.8 research draft). Runs only by hand, after typing DELETE.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DELETE to remove the old branches, releases and tags listed in this workflow
        required: true
permissions:
  contents: write
jobs:
  cleanup:
    if: inputs.confirm == 'DELETE'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASES: >-
        v0.1.0 v0.2.0 v0.3.0 v0.4.0 v0.5.0 v0.6.0 v0.7.0 v0.8.0 v0.9.0
        design-01-41954041188 design-01-41991569347 design-06-41954010646 design-06-41994574699
      BRANCHES: >-
        feature/original-filters claude/version-0-1-8-android-15-fix-si8lbs
        design/concept-01-simple design/concept-06-tabs diagnostics/04-crop-restore docs/camscanner-feature-audit
        feat/continuous-scan-crop feat/docscan-0.3 feat/gallery-pdf-sharing feat/pro-scan-editing
        feature/local-archive-backup feature/original-resolution-export fix/preview-auto-filter-detection fix/scan-bounds-swipe-review
        release/v0.2.0 release/v0.3.0 release/v0.4.0 release/v0.5.0 release/v0.6.0
    steps:
      - name: Refuse anything that must stay
        run: |
          for name in $RELEASES $BRANCHES; do
            case "$name" in main|rebuild/camscanner-reference|scanner-*|native-*) echo "Refusing to delete $name"; exit 1;; esac
          done
          # The new main must already hold all of feature/original-filters before that name goes away.
          [ "$(gh api repos/$GH_REPO/compare/main...feature/original-filters --jq .ahead_by 2>/dev/null || echo 0)" = 0 ]
      - name: Delete the old releases with their tags
        run: |
          for tag in $RELEASES; do
            if gh release view "$tag" > /dev/null 2>&1; then gh release delete "$tag" --yes --cleanup-tag && echo "deleted release $tag"
            elif gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$tag" > /dev/null 2>&1; then echo "deleted tag $tag"
            else echo "already gone: $tag"; fi
          done
      - name: Delete the old branches
        run: |
          for branch in $BRANCHES; do
            gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$branch" > /dev/null 2>&1 && echo "deleted branch $branch" || echo "already gone: $branch"
          done
      - name: What is left
        run: |
          echo "Branches:"; gh api "repos/$GH_REPO/branches?per_page=100" --jq '.[].name'
          echo "Releases:"; gh release list --limit 100

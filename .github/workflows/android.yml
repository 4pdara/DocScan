name: Android checks and APK

on:
  push:
    branches: [main, design/concept-06-tabs]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test, lint and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --console=plain
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DocScan-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14

  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable hardware acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Test crop, scanning controls and PDF export on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/test-on-emulator.sh
      - name: Upload device test reports and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-device-reports
          path: app/build/reports/
          retention-days: 14

  legacy-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable hardware acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Test gallery, sharing, PDF import and print ranges on Android 9
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86_64
          disable-animations: true
          script: DOCSCAN_DEVICE_TEST_CLASS=com.docscan.android.GallerySharingDeviceTest,com.docscan.android.ArchiveWorkflowDeviceTest,com.docscan.android.OriginalResolutionDeviceTest bash .github/scripts/test-on-emulator.sh
      - name: Upload legacy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-legacy-device-reports
          path: app/build/reports/
          retention-days: 14

  system-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable hardware acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Verify Android 15 gesture and button navigation with inline filters
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: DOCSCAN_DEVICE_TEST_CLASS=com.docscan.android.SystemBarsAndFiltersDeviceTest bash .github/scripts/test-on-emulator.sh
      - name: Upload system UI reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-system-ui-reports
          path: app/build/reports/
          retention-days: 14

  publish-design:
    if: github.event_name == 'push' && github.ref == 'refs/heads/design/concept-06-tabs'
    needs: [android, device-tests, legacy-gallery, system-ui]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PREVIEW_DESIGN: '06'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download exactly the tested APK and prepare checksums
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GH_REPO" --name DocScan-debug --dir verified-apk
          test -f verified-apk/app-debug.apk
          unzip -t verified-apk/app-debug.apk > /dev/null
          mkdir release-assets
          cp verified-apk/app-debug.apk "release-assets/DocScan-Design-$PREVIEW_DESIGN.apk"
          cd release-assets
          sha256sum "DocScan-Design-$PREVIEW_DESIGN.apk" > SHA256SUMS.txt
      - name: Publish isolated design preview
        run: |
          cp docs/DESIGN_PREVIEW_HE.md release-notes.md
          python3 - <<'PY'
          import os
          with open('release-notes.md', 'a') as out:
              out.write(f'\n\nSource commit: `{os.environ["GITHUB_SHA"]}`\n')
              out.write(f'\n[בדיקות ובנייה](https://github.com/{os.environ["GH_REPO"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]})\n')
          PY
          gh release create "design-$PREVIEW_DESIGN-$GITHUB_RUN_ID" \
            --repo "$GH_REPO" --target "$GITHUB_SHA" --prerelease \
            --title "DocScan Design $PREVIEW_DESIGN — גרסת עיצוב לבדיקה" \
            --notes-file release-notes.md \
            "release-assets/DocScan-Design-$PREVIEW_DESIGN.apk" release-assets/SHA256SUMS.txt

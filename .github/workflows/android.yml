name: Android checks and APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test, lint and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --console=plain
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DocScan-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14

  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable hardware acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Test crop, scanning controls and PDF export on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/test-on-emulator.sh
      - name: Upload device test reports and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-device-reports
          path: app/build/reports/
          retention-days: 14

  legacy-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable hardware acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Test gallery, sharing, PDF import and print ranges on Android 9
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86_64
          disable-animations: true
          script: DOCSCAN_DEVICE_TEST_CLASS=com.docscan.android.GallerySharingDeviceTest bash .github/scripts/test-on-emulator.sh
      - name: Upload legacy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-legacy-device-reports
          path: app/build/reports/
          retention-days: 14

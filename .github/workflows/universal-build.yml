name: Universal 0.1.8 compatibility build
on:
  push:
    branches: [rebuild/camscanner-reference]
    paths: [app/**, gradle/**, build.gradle.kts, settings.gradle.kts, gradle.properties, .github/workflows/universal-build.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: universal-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore the existing optional ARM64 processor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download native-v0.1.3-research --pattern DocScan-Native-0.1.3-debug.apk --dir /tmp/native-baseline
          echo '6b9ad458d620295a28bdabc0e7db87829dda7bec16fbb73862de09605fc16a5a  /tmp/native-baseline/DocScan-Native-0.1.3-debug.apk' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          target=Path('/tmp/native-input/arm64-v8a'); target.mkdir(parents=True)
          with zipfile.ZipFile('/tmp/native-baseline/DocScan-Native-0.1.3-debug.apk') as archive:
              for name in ['opencv','ncnn','MNN','CVNN','magicenhancer','imageprocessor']:
                  filename='lib'+name+'.so'; (target/filename).write_bytes(archive.read('lib/arm64-v8a/'+filename))
          PY
      - name: Build and check all four supported processor architectures
        run: ./gradlew -PcamScannerNativeDir=/tmp/native-input -PuniversalPreview=true testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Prepare a small exact APK transfer for private signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/4pdara/DocScan/actions/artifacts/13946827753/zip > /tmp/universal-baseline.zip
          echo 'a3f24b2a7fb6e565e48f376976dcd2afeb3b79fcc6701d16cae582a30be5930c  /tmp/universal-baseline.zip' | sha256sum -c -
          python3 - <<'PYCODE'
          import zipfile
          with zipfile.ZipFile('/tmp/universal-baseline.zip') as z:z.extractall('/tmp/universal-baseline')
          PYCODE
          python3 research/build_apk_delta.py --baseline /tmp/universal-baseline/debug/app-debug.apk --apk app/build/outputs/apk/debug/app-debug.apk --output signing-delta/app
          python3 research/build_apk_delta.py --baseline /tmp/universal-baseline/androidTest/debug/app-debug-androidTest.apk --apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk --output signing-delta/tests
      - uses: actions/upload-artifact@v4
        with:
          name: Universal-0.1.8-signing-delta
          path: signing-delta/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Universal-0.1.8-signing-input
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universal-build-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/schemas/
  book-ui:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reserve emulator space
        run: sudo rm -rf /usr/share/dotnet
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: Universal-0.1.8-signing-input
          path: ci-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -memory 4096
          script: bash .github/book-ui-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: book-ui-rtl
          path: book-ui-results/
